# Nginx Reverse Proxy Configuration for Linux Access Portal
# Place this in /etc/nginx/conf.d/linux-access-portal.conf

upstream linux_access_portal {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # SSL Certificate
    ssl_certificate /etc/ssl/certs/your-cert.pem;
    ssl_certificate_key /etc/ssl/private/your-key.pem;

    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Security Headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Max upload size for SSH key files
    client_max_body_size 10M;

    # API and Backend
    location /api/ {
        proxy_pass http://linux_access_portal;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Frontend Static Files
    location / {
        root /opt/linux-access-portal/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching
    location /assets/ {
        root /opt/linux-access-portal/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
